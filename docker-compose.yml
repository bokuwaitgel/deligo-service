services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - deligo_net

networks:
  deligo_net:
    driver: bridge
